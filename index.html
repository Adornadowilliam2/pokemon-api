<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    
      position: relative; 
    }


    .pokeball-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #top {
      width: 200px;
      height: 100px;
      border: 10px solid black;
      background-color: red;
      border-top-left-radius: 100px;
      border-top-right-radius: 100px;
    }

    #bot {
      width: 200px;
      height: 100px;
      border: 10px solid black;
      background-color: white;
      border-bottom-left-radius: 100px;
      border-bottom-right-radius: 100px;
      border-top: none;
    }

    #center {
      width: 60px; 
      height: 60px;
      border: 10px solid black;
      background-color: white;
      border-radius: 50%;
      position: absolute;
  
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
  </style>
</head>
<body>

  <section>
    <div class="pokeball-container">
      <div id="top"></div>
      <div id="bot"></div>
      <div id="center"></div>
    </div>
  </section>

</body>
</html>
